<svg xmlns="http://www.w3.org/2000/svg" width="650" height="280" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Adaptive day intervals</title>
<desc id="desc">Sun, moon, sun show one day without requiring the English word day. After each successful retrieval the next interval is one, three, seven, twenty-one, then sixty days from that success. Any unsuccessful retrieval returns to a one-day interval. These are scheduling symbols, not vocabulary targets.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203846"/></marker></defs>
<rect width="1000" height="430" rx="20" fill="#fffdf7"/>
