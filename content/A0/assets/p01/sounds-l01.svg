<svg xmlns="http://www.w3.org/2000/svg" width="660" height="726" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">Visual mouth and rhythm guidance</title>
<desc id="desc">Each row links a taught word to mouth positions in time order. Closed lips contrast with an open mouth; the raised tongue touches behind the upper teeth for the relevant consonant; rounded lips show the rounding movement. Small then large dots indicate a weak then strong beat in hello and goodbye. A long arrow extends the vowel. For is, a hand and vibration marks show final voiced z. IPA is optional helper reference; the diagrams do not replace hearing a competent model. This file contains no recording.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203846"/></marker></defs>
