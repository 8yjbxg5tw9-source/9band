<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Ask for the hidden name</title>
<desc id="desc">The speaker faces a person whose name badge is covered by a question mark. The speech bubble contains no model English sentence, so the learner retrieves the name question rather than reading it.</desc>
