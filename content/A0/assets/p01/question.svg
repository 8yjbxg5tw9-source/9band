<svg xmlns="http://www.w3.org/2000/svg" width="650" height="575" viewBox="0 0 1000 885" role="img" aria-labelledby="title desc">
<title id="title">Ask for a hidden name; receive the name</title>
<desc id="desc">The listener's name label is covered. Anna asks What is your name? In the second scene Tom gives My name is Tom and reveals the badge. The information gap supplies the meaning of the fixed question.</desc>
