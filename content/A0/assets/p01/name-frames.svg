<svg xmlns="http://www.w3.org/2000/svg" width="650" height="299" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Two ways to identify the same person</title>
<desc id="desc">I am Anna and My name is Anna refer to the same speaker. You are Tom and Your name is Tom refer to the same listener. The frame uses is after name, not am or are.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203846"/></marker></defs>
<rect width="1000" height="460" rx="20" fill="#fffdf7"/>
<rect x="25" y="52" width="380" height="112" rx="18" fill="white" stroke="#ccd9d9" stroke-width="3"/><text x="215" y="122" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="normal" opacity="1">I am Anna.</text><line x1="430" y1="105" x2="536" y2="105" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="563" y="52" width="410" height="112" rx="18" fill="#e3f1eb" stroke="#0f766e" stroke-width="3"/><text x="770" y="122" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="normal" opacity="1">My name is Anna.</text><rect x="25" y="262" width="380" height="112" rx="18" fill="white" stroke="#ccd9d9" stroke-width="3"/><text x="215" y="332" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="normal" opacity="1">You are Tom.</text><line x1="430" y1="315" x2="536" y2="315" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="563" y="262" width="410" height="112" rx="18" fill="#e3f1eb" stroke="#0f766e" stroke-width="3"/><text x="770" y="332" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="normal" opacity="1">Your name is Tom.</text>
</svg>
