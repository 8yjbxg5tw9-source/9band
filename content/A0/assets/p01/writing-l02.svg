<svg xmlns="http://www.w3.org/2000/svg" width="650" height="306" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Model, trace, copy</title>
<desc id="desc">A clear model appears first; the same line is pale for tracing; then a blank line and a pencil invite copying. Letter names are not required for tracing the shown shapes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#203846"/></marker></defs>
<rect width="1000" height="470" rx="20" fill="#fffdf7"/>
<text x="495" y="90" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="normal" opacity="1">My name is Anna.</text><line x1="490" y1="125" x2="490" y2="165" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="495" y="245" text-anchor="middle" fill="#203846" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="normal" opacity="0.25">My name is Anna.</text><g transform="translate(850 219) rotate(-35) scale(1)"><path d="M -7 -36 L 7 -36 L 7 24 L 0 38 L -7 24 Z" fill="#efb540" stroke="#203846" stroke-width="3"/><path d="M -4 30 L 0 38 L 4 30" fill="#203846"/></g><line x1="490" y1="284" x2="490" y2="329" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="140" y1="426" x2="850" y2="426" stroke="#203846" stroke-width="3" stroke-linecap="round"/><g transform="translate(850 390) rotate(-35) scale(1)"><path d="M -7 -36 L 7 -36 L 7 24 L 0 38 L -7 24 Z" fill="#efb540" stroke="#203846" stroke-width="3"/><path d="M -4 30 L 0 38 L 4 30" fill="#203846"/></g>
</svg>
