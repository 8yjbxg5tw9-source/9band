<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Anna refers to the speaker</title>
<desc id="desc">Only Anna speaks. The speech bubble points to Anna, and the fingertip points back to the speaker's own chest. The badge identifies the role without testing the name's meaning.</desc>
