<svg xmlns="http://www.w3.org/2000/svg" width="640" height="275" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">A helper reads; the learner hears then responds</title>
<desc id="desc">An English-speaking helper reads the script without showing the text, the learner receives the sound, then selects a response. With no helper and no recording this activity cannot supply listening evidence; its text can only be read as rehearsal.</desc>
