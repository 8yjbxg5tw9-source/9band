<svg xmlns="http://www.w3.org/2000/svg" width="660" height="576" viewBox="0 0 940 820" role="img" aria-labelledby="title desc">
<title id="title">Five demonstrated actions</title>
<desc id="desc">From top to bottom: see and point at a shape; imitate a helper's spoken sound; copy a shape with a pencil; select the identical shape; hide a card, recall it, then uncover and check. No English instruction word is required.</desc>
